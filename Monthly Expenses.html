<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Budget Pro V9.6</title>
    <style>
        :root { 
            --primary: #1a73e8; --success: #34a853; --warning: #fbbc04; --danger: #ea4335;
            --bg: #f0f2f5; --card-bg: #ffffff; --text: #202124; --text-light: #5f6368;
            --border: #e8eaed; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #121212; --card-bg: #1e1e1e; --text: #e8eaed; --text-light: #9aa0a6; --border: #3c4043; }
        }

        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 12px; color: var(--text); line-height: 1.5; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); box-sizing: border-box; }
        
        .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
        
        /* Header & Limit */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        .limit-input-wrap { display: flex; align-items: center; background: var(--card-bg); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); }
        .limit-input-wrap input { border: none; background: transparent; width: 60px; font-weight: bold; color: var(--primary); font-size: 16px; outline: none; text-align: center; }

        /* Top Health Bar */
        .health-card { padding: 12px 20px; margin-bottom: 16px; }
        .ratio-bar { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; display: flex; margin: 10px 0; }
        .ratio-fill { height: 100%; transition: width 0.5s ease; }

        /* Calendar */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .day-header { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; text-align: center; color: var(--text-light); padding-bottom: 8px; }
        .day { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; position: relative; transition: 0.2s; }
        .day.today { border: 2px solid var(--primary); }
        .day.selected { background: var(--primary) !important; color: white !important; transform: scale(1.05); z-index: 2; }
        .day-amt { font-size: 9px; margin-top: 2px; font-weight: 500; }
        .spread-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--primary); position: absolute; top: 4px; right: 4px; }

        /* Split Action Buttons */
        .btn-row { display: flex; gap: 12px; margin-bottom: 16px; width: 100%; box-sizing: border-box; }
        .action-btn { flex: 1; display: flex; flex-direction: column; align-items: flex-start; padding: 12px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); cursor: pointer; box-sizing: border-box; }

        /* Metrics */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .sum-val { font-size: 20px; font-weight: 700; margin-top: 4px; display: block; }
        .progress-container { height: 6px; background: var(--border); border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.5s ease; }

        /* Input Form */
        .input-group { margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-light); margin-bottom: 6px; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; background: var(--card-bg); color: var(--text); outline: none; box-sizing: border-box; }
        
        .quick-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .tag { padding: 6px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; font-size: 12px; cursor: pointer; color: var(--text-light); }

        /* List Styling */
        .cat-sum-item { display: inline-block; padding: 2px 8px; background: var(--bg); border-radius: 6px; font-size: 11px; margin-right: 6px; margin-bottom: 10px; color: var(--text-light); border: 1px solid var(--border); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
        .btn-main { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .del-btn { color: var(--danger); opacity: 0.3; padding: 10px; border: none; background: none; font-size: 18px; }

        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: var(--card-bg); margin: 15% auto; width: 88%; padding: 24px; border-radius: 20px; max-height: 75vh; overflow-y: auto; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="header-row">
    <div class="limit-input-wrap">
        <span style="font-size:11px; color:var(--text-light); margin-right:8px; font-weight:bold;">DAILY BUDGET</span>
        <span style="color:var(--primary); font-weight:bold;">$</span>
        <input type="number" id="dailyLimitInput" inputmode="decimal" onchange="updateLimit()">
    </div>
</div>

<div class="card health-card">
    <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold;">
        <span>MONTHLY HEALTH</span>
        <span id="healthPct">0%</span>
    </div>
    <div class="ratio-bar">
        <div id="fixedBar" class="ratio-fill" style="background:var(--primary);"></div>
        <div id="dailyBar" class="ratio-fill" style="background:var(--warning);"></div>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--text-light); font-weight:bold;">
        <span>● FIXED</span><span>● DAILY</span><span>○ REMAINING</span>
    </div>
</div>

<div class="card" style="padding: 15px;">
    <div class="header-row" style="margin-bottom: 15px;">
        <button onclick="changeMonth(-1)" style="border:none; background:none; color:var(--primary); font-weight:bold;">← PREV</button>
        <h3 id="monthTitle" style="margin:0; font-size:16px;">April 2026</h3>
        <button onclick="changeMonth(1)" style="border:none; background:none; color:var(--primary); font-weight:bold;">NEXT →</button>
    </div>
    <div class="calendar-grid" id="calendar"></div>
</div>

<div class="btn-row">
    <div class="action-btn" onclick="showModal('fixed')">
        <small style="font-weight:700; color:var(--text-light); font-size:10px;">FIXED EXPENSES</small>
        <div class="mono" id="fixedTotalBtn" style="color:var(--primary); font-weight:bold; font-size:16px;">$0.00</div>
    </div>
    <div class="action-btn" onclick="showModal('income')">
        <small style="font-weight:700; color:var(--text-light); font-size:10px;">TOTAL INCOME</small>
        <div class="mono" id="incomeTotalBtn" style="color:var(--success); font-weight:bold; font-size:16px;">$0.00</div>
    </div>
</div>

<div class="summary-grid">
    <div class="card" style="margin-bottom:0;">
        <small style="color:var(--text-light); font-weight:bold;">TODAY</small>
        <span id="dayTotal" class="sum-val mono">$0.00</span>
    </div>
    <div class="card" style="margin-bottom:0; position:relative; overflow:hidden;">
        <small style="color:var(--text-light); font-weight:bold;">WEEK SURPLUS</small>
        <span id="weekSurplus" class="sum-val mono" style="color:var(--success);">$0.00</span>
        <div class="progress-container"><div id="weekProgress" class="progress-bar"></div></div>
    </div>
</div>

<div class="card" id="inputArea">
    <h4 id="inputTitle" style="margin:0 0 15px 0; font-size:14px; opacity:0.8;">Record: 2026-04-20</h4>
    <div class="input-group">
        <label>Category</label>
        <select id="cat" onchange="updateQuickTags()">
            <option value="food">🍔 Food & Dining</option>
            <option value="transport">🚕 Transport</option>
            <option value="grocery">🛒 Grocery (7D Spread)</option>
            <option value="fixed">🏠 Fixed Expense</option>
            <option value="income">💰 Income</option>
            <option value="other">📦 Other</option>
        </select>
    </div>
    <div class="input-group">
        <label>Amount</label>
        <input type="number" id="amt" inputmode="decimal" placeholder="0.00" style="font-size: 24px; font-weight: bold; text-align: center; color: var(--primary);">
    </div>
    <div class="input-group">
        <label>Note</label>
        <input type="text" id="desc" placeholder="Details...">
        <div class="quick-tags" id="tagContainer"></div>
    </div>
    <button class="btn-main" onclick="addEntry()">SAVE RECORD</button>
</div>

<div class="card">
    <h4 style="margin:0 0 15px 0; font-size:14px; color:var(--text-light);">DAILY DETAILS</h4>
    <div id="daySumArea"></div>
    <div id="dayList"></div>
</div>

<div style="display:flex; gap:10px; margin-bottom: 40px; padding: 0 5px;">
    <button class="tag" style="flex:1; padding:12px;" onclick="exportData()">Export Data</button>
    <button class="tag" style="flex:1; padding:12px;" onclick="document.getElementById('importFile').click()">Import Data</button>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)">
</div>

<div id="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 id="modalTitle" style="margin-top:0;">Details</h3>
        <div id="modalList"></div>
        <button class="btn-main" onclick="closeModal()" style="background:var(--bg); color:var(--text); margin-top:20px;">CLOSE</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('budget_v9')) || { entries: [], dailyLimit: 20 };
    let viewDate = new Date();
    let selectedDate = new Date().toISOString().split('T')[0];

    const tagMap = {
        food: ['Breakfast', 'Lunch', 'Dinner', '7-11', 'Grab', 'Delivery'],
        transport: ['BTS', 'MRT', 'Grab', 'Bus', 'Bolt', 'Taxi'],
        fixed: ['Rent', 'Electricity', 'Internet', 'Subscriptions', 'Donations'],
        income: ['BB', 'YC'],
        grocery: ['Market', 'BigC', 'Lotus', 'Makro'],
        other: ['Shopping', 'Travel']
    };

    function init() {
        document.getElementById('dailyLimitInput').value = db.dailyLimit;
        updateQuickTags();
        renderCalendar();
        updateDisplay();
    }

    function updateQuickTags() {
        const cat = document.getElementById('cat').value;
        const container = document.getElementById('tagContainer');
        container.innerHTML = '';
        (tagMap[cat] || []).forEach(tag => {
            container.innerHTML += `<div class="tag" onclick="quickFill('${tag}')">${tag}</div>`;
        });
    }

    function quickFill(text) { document.getElementById('desc').value = text; }

    function getDaySpent(dateStr) {
        let total = 0;
        const targetDate = new Date(dateStr);
        db.entries.forEach(e => {
            if (e.date === dateStr && ['food', 'transport', 'other'].includes(e.cat)) total += e.amt;
            if (e.cat === 'grocery') {
                const diff = Math.ceil((targetDate - new Date(e.date)) / 86400000);
                if (diff >= 0 && diff < 7) total += (e.amt / 7);
            }
        });
        return total;
    }

    function renderCalendar() {
        const cal = document.getElementById('calendar'); cal.innerHTML = '';
        ['S','M','T','W','T','F','S'].forEach(l => cal.innerHTML += `<div class="day-header">${l}</div>`);
        const y = viewDate.getFullYear(), m = viewDate.getMonth();
        document.getElementById('monthTitle').innerText = `${new Intl.DateTimeFormat('en-US', {month:'long'}).format(viewDate)} ${y}`;
        const firstDay = new Date(y, m, 1).getDay();
        const lastDate = new Date(y, m + 1, 0).getDate();
        const todayStr = new Date().toISOString().split('T')[0];

        for(let i=0; i<firstDay; i++) cal.innerHTML += `<div></div>`;
        for(let d=1; d<=lastDate; d++) {
            const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const spent = getDaySpent(dateStr);
            const hasSpread = db.entries.some(e => e.cat === 'grocery' && Math.ceil((new Date(dateStr) - new Date(e.date)) / 86400000) > 0 && Math.ceil((new Date(dateStr) - new Date(e.date)) / 86400000) < 7);
            cal.innerHTML += `<div class="day ${dateStr===selectedDate?'selected':''} ${dateStr===todayStr?'today':''}" onclick="selectDate('${dateStr}')">${d}<div class="day-amt mono">${spent>0?Math.round(spent):''}</div>${hasSpread?'<div class="spread-dot"></div>':''}</div>`;
        }
    }

    function selectDate(d) { selectedDate = d; document.getElementById('inputTitle').innerText = `Record: ${d}`; renderCalendar(); updateDisplay(); }

    function addEntry() {
        const amt = parseFloat(document.getElementById('amt').value);
        if(!amt) return;
        db.entries.push({ id: Date.now(), date: selectedDate, cat: document.getElementById('cat').value, amt, desc: document.getElementById('desc').value || document.getElementById('cat').value });
        localStorage.setItem('budget_v9', JSON.stringify(db));
        document.getElementById('amt').value = ''; document.getElementById('desc').value = '';
        renderCalendar(); updateDisplay();
    }

    function deleteEntry(id) {
        db.entries = db.entries.filter(e => e.id !== id);
        localStorage.setItem('budget_v9', JSON.stringify(db));
        renderCalendar(); updateDisplay();
    }

    function updateDisplay() {
        const prefix = `${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,'0')}`;
        let income = 0, fixed = 0, daily = 0;
        db.entries.forEach(e => {
            if(e.date.startsWith(prefix)) {
                if(e.cat === 'income') income += e.amt;
                else if(e.cat === 'fixed') fixed += e.amt;
                else daily += e.amt;
            }
        });

        // Top Bar
        const totalPct = income > 0 ? ((fixed + daily) / income * 100).toFixed(1) : 0;
        document.getElementById('healthPct').innerText = totalPct + '%';
        document.getElementById('fixedBar').style.width = income > 0 ? Math.min((fixed / income * 100), 100) + '%' : '0%';
        document.getElementById('dailyBar').style.width = income > 0 ? Math.min((daily / income * 100), (100 - (fixed/income*100))) + '%' : '0%';
        document.getElementById('fixedTotalBtn').innerText = `$${fixed.toFixed(2)}`;
        document.getElementById('incomeTotalBtn').innerText = `$${income.toFixed(2)}`;

        // List and Summary
        const list = document.getElementById('dayList'); list.innerHTML = '';
        const sumArea = document.getElementById('daySumArea'); sumArea.innerHTML = '';
        const dayEntries = db.entries.filter(e => e.date === selectedDate);
        
        let catSums = {};
        dayEntries.forEach(e => {
            catSums[e.cat] = (catSums[e.cat] || 0) + e.amt;
            list.innerHTML += `<div class="list-item"><div><div style="font-weight:bold; font-size:15px;">${e.desc}</div><small style="color:var(--text-light); text-transform:uppercase; font-size:10px;">${e.cat}</small></div><div style="display:flex; align-items:center;"><span class="mono" style="font-weight:bold;">$${e.amt.toFixed(2)}</span><button class="del-btn" onclick="deleteEntry(${e.id})">×</button></div></div>`;
        });
        
        Object.keys(catSums).forEach(c => {
            sumArea.innerHTML += `<span class="cat-sum-item"><b>${c.toUpperCase()}:</b> $${catSums[c].toFixed(2)}</span>`;
        });
        
        document.getElementById('dayTotal').innerText = `$${getDaySpent(selectedDate).toFixed(2)}`;
        
        // Week
        const curr = new Date(selectedDate);
        const mon = new Date(curr.setDate(curr.getDate() - (curr.getDay() || 7) + 1));
        let weekSpent = 0;
        for(let i=0; i<7; i++) { weekSpent += getDaySpent(new Date(mon).toISOString().split('T')[0]); mon.setDate(mon.getDate() + 1); }
        const limit = db.dailyLimit * 7;
        document.getElementById('weekSurplus').innerText = `$${(limit - weekSpent).toFixed(2)}`;
        document.getElementById('weekProgress').style.width = Math.min((weekSpent/limit)*100, 100) + '%';
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `budget_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (event) => { db = JSON.parse(event.target.result); localStorage.setItem('budget_v9', JSON.stringify(db)); init(); };
        reader.readAsText(e.target.files[0]);
    }

    function showModal(type) {
        const list = document.getElementById('modalList'); list.innerHTML = '';
        const prefix = `${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,'0')}`;
        document.getElementById('modalTitle').innerText = type === 'fixed' ? 'Fixed Expenses' : 'Income Records';
        db.entries.filter(e => e.cat === type && e.date.startsWith(prefix)).sort((a,b)=>b.date.localeCompare(a.date)).forEach(e => {
            list.innerHTML += `<div class="list-item"><span>${e.date.split('-')[2]}: ${e.desc}</span><strong class="mono">$${e.amt.toFixed(2)}</strong></div>`;
        });
        document.getElementById('modal').style.display = 'block';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function changeMonth(s) { viewDate.setMonth(viewDate.getMonth() + s); renderCalendar(); updateDisplay(); }
    function updateLimit() { db.dailyLimit = parseFloat(document.getElementById('dailyLimitInput').value) || 20; updateDisplay(); }
    
    init();
</script>
</body>
</html>
